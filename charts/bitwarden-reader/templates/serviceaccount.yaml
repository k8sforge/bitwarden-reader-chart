{{- if and .Values.serviceAccount.create .Values.global.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bitwarden-reader.serviceAccountName" . }}
  namespace: {{ include "bitwarden-reader.namespace" . }}
  labels:
    {{- include "bitwarden-reader.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
